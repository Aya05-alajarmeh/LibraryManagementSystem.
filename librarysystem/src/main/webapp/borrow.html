<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Manage Borrowings - Library Management System</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100vh;
        background-color: #0b0f19;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        background:
          linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
          url("https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=1920&auto=format&fit=crop")
            no-repeat center center fixed;
        background-size: cover;
        color: #f8fafc;
      }

      .main-header {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 18px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 100;
      }

      .header-brand {
        font-size: 20px;
        font-weight: 700;
        color: #ffffff;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .header-brand span {
        color: #38bdf8;
      }

      .nav-links {
        display: flex;
        gap: 8px;
        list-style: none;
      }

      .nav-links li {
        padding: 9px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        color: #cbd5e1;
        transition: all 0.2s ease;
      }

      .nav-links li:hover {
        background: rgba(56, 189, 248, 0.15);
        color: #ffffff;
      }

      .nav-links li.active {
        background: #38bdf8;
        color: #0f172a;
        font-weight: 600;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .user-badge {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 7px 14px;
        border-radius: 20px;
        color: #e2e8f0;
        font-size: 13px;
        font-weight: 500;
      }

      .logout-btn {
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.2s ease;
      }

      .logout-btn:hover {
        background: #ef4444;
        color: #ffffff;
      }

      .dashboard-container {
        flex-grow: 1;
        padding: 30px 40px;
        overflow-y: auto;
        max-width: 1400px;
        margin: 0 auto;
        width: 100%;
      }

      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
      }

      .page-header h2 {
        font-size: 24px;
        font-weight: 600;
        color: #ffffff;
      }

      .table-container {
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        font-size: 14px;
      }

      th,
      td {
        padding: 16px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      th {
        background: rgba(30, 41, 59, 0.8);
        color: #38bdf8;
        font-weight: 600;
      }

      tr {
        transition: background 0.2s ease;
      }

      tr:hover {
        background: rgba(56, 189, 248, 0.04);
      }

      .status-badge {
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        background: rgba(56, 189, 248, 0.15);
        color: #38bdf8;
        border: 1px solid rgba(56, 189, 248, 0.3);
      }

      .btn-return {
        background: rgba(34, 197, 94, 0.15);
        color: #4ade80;
        border: 1px solid rgba(34, 197, 94, 0.3);
        padding: 6px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: all 0.2s;
      }

      .btn-return:hover {
        background: #22c55e;
        color: #ffffff;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header class="main-header">
      <div class="header-brand">Library<span>System</span></div>

      <ul class="nav-links">
        <li onclick="navigateTo('dashboard.html')">Dashboard</li>
        <li id="navUsers" onclick="navigateTo('users.html')">Users</li>
        <li onclick="navigateTo('members.html')">Members</li>
        <li onclick="navigateTo('books.html')">Books</li>
        <li onclick="navigateTo('categories.html')">Categories</li>
        <li class="active" onclick="navigateTo('borrow.html')">Borrowings</li>

        <li onclick="navigateTo('fines.html')">Fines</li>
      </ul>

      <div class="header-right">
        <div class="user-badge" id="userProfileName">Loading...</div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </header>

    <main class="dashboard-container">
      <div class="page-header">
        <h2>Active Borrowings (Return Books)</h2>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Borrow ID</th>
              <th>Book Title</th>
              <th>Barcode</th>
              <th>Member Name</th>
              <th>Borrow Date</th>
              <th>Due Date</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="activeBorrowsTableBody">
            <tr>
              <td colspan="8" style="text-align: center; color: #94a3b8">
                Loading active borrowings...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <script>
      const CONTEXT_PATH = "/librarysystem-1.0-SNAPSHOT";

      const userJson = localStorage.getItem("currentUser");
      if (!userJson) {
        window.location.href = CONTEXT_PATH + "/login.html";
      } else {
        const user = JSON.parse(userJson);
        document.getElementById("userProfileName").innerText =
          `${user.firstName || user.fullName || ""} (${user.role || ""})`;

        if (user.role !== "ADMIN") {
          const navUsers = document.getElementById("navUsers");
          if (navUsers) navUsers.classList.add("hidden");
        }
        loadActiveBorrows();
      }

      async function loadActiveBorrows() {
        try {
          const response = await fetch(CONTEXT_PATH + "/api/borrows/active");
          if (response.ok) {
            const borrows = await response.json();
            const tbody = document.getElementById("activeBorrowsTableBody");
            tbody.innerHTML = "";

            if (!borrows || borrows.length === 0) {
              tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #94a3b8;">No active borrowings found.</td></tr>`;
              return;
            }

            borrows.forEach((b) => {
              const borrowId = b.borrowId || b.id || "N/A";
              const bookTitle = b.bookTitle || (b.book ? b.book.title : "N/A");
              const barcode = b.barcode || "N/A";
              const memberName =
                b.memberName ||
                (b.member ? b.member.fullName || b.member.firstName : "N/A");
              const borrowDate = b.borrowDate || b.date || "N/A";
              const dueDate = b.dueDate || "N/A";
              const status = b.status || "Borrowed";

              tbody.innerHTML += `
                <tr>
                    <td>${borrowId}</td>
                    <td>${bookTitle}</td>
                    <td>${barcode}</td>
                    <td>${memberName}</td>
                    <td>${borrowDate}</td>
                    <td>${dueDate}</td>
                    <td><span class="status-badge">${status}</span></td>
                    <td>
                        <button class="btn-return" onclick="returnBook(${borrowId})">Return</button>
                    </td>
                </tr>
              `;
            });
          } else {
            document.getElementById("activeBorrowsTableBody").innerHTML =
              `<tr><td colspan="8" style="text-align: center; color: #ef4444;">Failed to load active borrowings.</td></tr>`;
          }
        } catch (error) {
          console.error("Error loading active borrowings:", error);
          document.getElementById("activeBorrowsTableBody").innerHTML =
            `<tr><td colspan="8" style="text-align: center; color: #ef4444;">Error connecting to server.</td></tr>`;
        }
      }

      async function returnBook(borrowId) {
        if (confirm("Are you sure you want to return this book?")) {
          try {
            const response = await fetch(CONTEXT_PATH + "/api/borrows/return", {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ borrowId: borrowId }),
            });

            const result = await response.json();
            if (response.ok) {
              alert(result.message || "Book returned successfully");
              loadActiveBorrows();
            } else {
              alert(result.error || "Return operation failed");
            }
          } catch (error) {
            console.error("Error returning book:", error);
            alert("An error occurred while processing the return operation.");
          }
        }
      }

      function navigateTo(page) {
        window.location.assign(CONTEXT_PATH + "/" + page);
      }

      function logout() {
        localStorage.removeItem("currentUser");

        sessionStorage.removeItem("currentUser");
        window.location.href = CONTEXT_PATH + "/login.html";
      }
    </script>
  </body>
</html>
