<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login - Library Management System</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background:
          linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
          url("https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=1920&auto=format&fit=crop")
            no-repeat center center fixed;
        background-size: cover;
        color: #f8fafc;
      }

      .login-card {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        width: 380px;
        text-align: center;
      }

      .login-card h2 {
        margin-bottom: 25px;
        color: #ffffff;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .login-card h2 span {
        color: #38bdf8;
      }

      .form-group {
        margin-bottom: 20px;
        text-align: left;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #94a3b8;
        font-weight: 500;
        font-size: 13px;
      }

      .form-group input {
        width: 100%;
        padding: 12px 14px;
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: #ffffff;
        font-size: 14px;
        transition: all 0.2s ease;
      }

      .form-group input:focus {
        outline: none;
        border-color: #38bdf8;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
      }

      .btn {
        width: 100%;
        background: #38bdf8;
        color: #0f172a;
        border: none;
        padding: 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        transition: all 0.2s ease;
        margin-top: 10px;
      }

      .btn:hover {
        background: #0ea5e9;
        box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
      }

      #error-msg {
        color: #f87171;
        font-size: 13px;
        margin-top: 15px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h2>Library<span>System</span></h2>
      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input
            type="text"
            id="username"
            placeholder="Enter your username"
            required
          />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          />
        </div>
        <button type="submit" class="btn">Login</button>
        <div id="error-msg"></div>
      </form>
    </div>

    <script>
      const CONTEXT_PATH = "/librarysystem-1.0-SNAPSHOT";

      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;

          const loginData = {
            username: username,
            password: password,
          };

          try {
            const response = await fetch(CONTEXT_PATH + "/api/auth/login", {
              method: "POST",
              headers: {
                "Content-Type": "application/json;charset=UTF-8",
              },
              body: JSON.stringify(loginData),
            });

            if (response.ok) {
              const user = await response.json();

              localStorage.setItem("currentUser", JSON.stringify(user));
              alert("Login successful! Welcome " + user.firstName);

              window.location.href = CONTEXT_PATH + "/dashboard.html";
            } else {
              const result = await response.json();
              document.getElementById("error-msg").innerText =
                result.error || "Invalid username or password";
            }
          } catch (err) {
            document.getElementById("error-msg").innerText =
              "Connection error with the server";
          }
        });
    </script>
  </body>
</html>
