<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fines Management - Library Management System</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100vh;
        background-color: #0b0f19;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        background:
          linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
          url("https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=1920&auto=format&fit=crop")
            no-repeat center center fixed;
        background-size: cover;
        color: #f8fafc;
      }

      .main-header {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 18px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 100;
      }

      .header-brand {
        font-size: 20px;
        font-weight: 700;
        color: #ffffff;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .header-brand span {
        color: #38bdf8;
      }

      .nav-links {
        display: flex;
        gap: 8px;
        list-style: none;
      }

      .nav-links li {
        padding: 9px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        color: #cbd5e1;
        transition: all 0.2s ease;
      }

      .nav-links li:hover {
        background: rgba(56, 189, 248, 0.15);
        color: #ffffff;
      }

      .nav-links li.active {
        background: #38bdf8;
        color: #0f172a;
        font-weight: 600;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .user-badge {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 7px 14px;
        border-radius: 20px;
        color: #e2e8f0;
        font-size: 13px;
        font-weight: 500;
      }

      .logout-btn {
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.2s ease;
      }

      .logout-btn:hover {
        background: #ef4444;
        color: #ffffff;
      }

      .dashboard-container {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        padding: 40px;
        max-width: 1350px;
        margin: 0 auto;
        width: 100%;
        overflow-y: auto;
      }

      .page-title-box {
        margin-bottom: 25px;
      }

      .page-title-box h2 {
        font-size: 24px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 5px;
      }

      .page-title-box p {
        font-size: 14px;
        color: #94a3b8;
      }

      .content-card {
        background: linear-gradient(
          135deg,
          rgba(15, 23, 42, 0.85) 0%,
          rgba(11, 15, 25, 0.9) 100%
        );
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        overflow: hidden;
      }

      .table-responsive {
        width: 100%;
        overflow-x: auto;
      }

      .custom-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        font-size: 14px;
      }

      .custom-table th {
        background: rgba(15, 23, 42, 0.95);
        color: #94a3b8;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 0.8px;
        padding: 16px 24px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .custom-table td {
        padding: 16px 24px;
        color: #e2e8f0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .custom-table tbody tr:hover {
        background: rgba(56, 189, 248, 0.04);
      }

      .badge-unpaid {
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
        padding: 5px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
      }

      .pay-btn {
        background: rgba(34, 197, 94, 0.15);
        color: #4ade80;
        border: 1px solid rgba(34, 197, 94, 0.3);
        padding: 6px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.2s ease;
      }

      .pay-btn:hover {
        background: #22c55e;
        color: #ffffff;
      }

      .no-data {
        text-align: center;
        padding: 40px;
        color: #94a3b8;
        font-style: italic;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header class="main-header">
      <div class="header-brand">Library<span>System</span></div>

      <ul class="nav-links">
        <li onclick="navigateTo('dashboard.html')">Dashboard</li>
        <li id="navUsers" onclick="navigateTo('users.html')">Users</li>
        <li onclick="navigateTo('members.html')">Members</li>
        <li onclick="navigateTo('books.html')">Books</li>
        <li onclick="navigateTo('categories.html')">Categories</li>
        <li onclick="navigateTo('borrow.html')">Borrowings</li>
        <li class="active" onclick="navigateTo('fines.html')">Fines</li>
      </ul>

      <div class="header-right">
        <div class="user-badge" id="userProfileName">Loading...</div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </header>

    <main class="dashboard-container">
      <div class="page-title-box">
        <h2>Unpaid Fines Management</h2>
        <p>View and process payments for outstanding member fines</p>
      </div>

      <div class="content-card">
        <div class="table-responsive">
          <table class="custom-table">
            <thead>
              <tr>
                <th>Fine ID</th>
                <th>Borrow ID</th>
                <th>Amount</th>
                <th>Fine Date</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="finesTableBody">
              <!-- Data will be loaded dynamically via JavaScript -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script>
      const CONTEXT_PATH = "/librarysystem-1.0-SNAPSHOT";
      const userJson = localStorage.getItem("currentUser");

      if (!userJson) {
        window.location.href = CONTEXT_PATH + "/login.html";
      } else {
        const user = JSON.parse(userJson);

        document.getElementById("userProfileName").innerText =
          `${user.firstName} ${user.lastName} (${user.role})`;

        if (user.role !== "ADMIN") {
          const navUsers = document.getElementById("navUsers");
          if (navUsers) navUsers.classList.add("hidden");
        }

        loadUnpaidFines();
      }

      // Function to fetch unpaid fines and render them in the table
      async function loadUnpaidFines() {
        try {
          const response = await fetch(CONTEXT_PATH + "/api/fines/unpaid");
          if (!response.ok) {
            throw new Error("Failed to fetch fines data");
          }
          const fines = await response.json();
          const tbody = document.getElementById("finesTableBody");
          tbody.innerHTML = "";

          if (!fines || fines.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="no-data">No unpaid fines found at the moment.</td></tr>`;
            return;
          }

          fines.forEach((fine) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${fine.fineId || ""}</td>
              <td>${fine.borrowId || ""}</td>
              <td>${fine.amount || 0} $</td>
              <td>${fine.fineDate || ""}</td>
              <td><span class="badge-unpaid">${fine.status || "Unpaid"}</span></td>
              <td>
                <button class="pay-btn" onclick="payFine(${fine.fineId})">
                  Pay Fine
                </button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        } catch (error) {
          console.error("Error:", error);
          alert("An error occurred while loading fines.");
        }
      }

      // Function to process fine payment
      async function payFine(fineId) {
        if (!confirm("Are you sure you want to mark this fine as paid?")) {
          return;
        }

        try {
          const response = await fetch(
            CONTEXT_PATH + `/api/fines/pay?fineId=${fineId}`,
            {
              method: "POST",
            },
          );

          const result = await response.json();

          if (response.ok) {
            alert(result.message || "Fine paid successfully");
            loadUnpaidFines(); // Refresh the table
          } else {
            alert(result.error || "Failed to pay fine");
          }
        } catch (error) {
          console.error("Error:", error);
          alert("An error occurred while communicating with the server.");
        }
      }

      function navigateTo(page) {
        window.location.assign(CONTEXT_PATH + "/" + page);
      }

      function logout() {
        localStorage.removeItem("currentUser");
        sessionStorage.removeItem("currentUser");
        window.location.href = CONTEXT_PATH + "/login.html";
      }
    </script>
  </body>
</html>
