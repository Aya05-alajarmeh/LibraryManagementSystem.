<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Manage Users - Library Management System</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100vh;
        background-color: #0b0f19;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        background:
          linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
          url("https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=1920&auto=format&fit=crop")
            no-repeat center center fixed;
        background-size: cover;
        color: #f8fafc;
      }

      .main-header {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 18px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 100;
      }

      .header-brand {
        font-size: 20px;
        font-weight: 700;
        color: #ffffff;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .header-brand span {
        color: #38bdf8;
      }

      .nav-links {
        display: flex;
        gap: 8px;
        list-style: none;
      }

      .nav-links li {
        padding: 9px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        color: #cbd5e1;
        transition: all 0.2s ease;
      }

      .nav-links li:hover {
        background: rgba(56, 189, 248, 0.15);
        color: #ffffff;
      }

      .nav-links li.active {
        background: #38bdf8;
        color: #0f172a;
        font-weight: 600;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .user-badge {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 7px 14px;
        border-radius: 20px;
        color: #e2e8f0;
        font-size: 13px;
        font-weight: 500;
      }

      .logout-btn {
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.2s ease;
      }

      .logout-btn:hover {
        background: #ef4444;
        color: #ffffff;
      }

      .dashboard-container {
        flex-grow: 1;
        padding: 30px 40px;
        overflow-y: auto;
        max-width: 1300px;
        margin: 0 auto;
        width: 100%;
      }

      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
      }

      .page-header h2 {
        font-size: 24px;
        font-weight: 600;
        color: #ffffff;
      }

      .action-btn {
        background: #38bdf8;
        color: #0f172a;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .action-btn:hover {
        background: #0ea5e9;
        box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
      }

      .table-container {
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        font-size: 14px;
      }

      th,
      td {
        padding: 16px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      th {
        background: rgba(30, 41, 59, 0.8);
        color: #38bdf8;
        font-weight: 600;
      }

      tr:hover {
        background: rgba(255, 255, 255, 0.02);
      }

      .btn-edit {
        background: rgba(56, 189, 248, 0.15);
        color: #38bdf8;
        border: 1px solid rgba(56, 189, 248, 0.3);
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        margin-right: 6px;
        transition: all 0.2s;
      }

      .btn-edit:hover {
        background: #38bdf8;
        color: #0f172a;
      }

      .btn-delete {
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.2s;
      }

      .btn-delete:hover {
        background: #ef4444;
        color: #ffffff;
      }

      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(5px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }

      .modal-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }

      .modal-box {
        background: #0f172a;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 30px;
        border-radius: 14px;
        width: 500px;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }

      .modal-box h3 {
        color: #ffffff;
        margin-bottom: 20px;
        font-size: 20px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 6px;
      }

      .form-group input,
      .form-group select {
        width: 100%;
        padding: 10px 14px;
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: #ffffff;
        font-size: 14px;
      }

      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: #38bdf8;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 25px;
      }

      .btn-cancel {
        background: rgba(255, 255, 255, 0.08);
        color: #cbd5e1;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
      }

      .btn-cancel:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header class="main-header">
      <div class="header-brand">Library<span>System</span></div>

      <ul class="nav-links">
        <li onclick="navigateTo('dashboard.html')">Dashboard</li>
        <li id="navUsers" class="active" onclick="navigateTo('users.html')">
          Users
        </li>
        <li onclick="navigateTo('members.html')">Members</li>
        <li onclick="navigateTo('books.html')">Books</li>
        <li onclick="navigateTo('categories.html')">Categories</li>
        <li onclick="navigateTo('borrow.html')">Borrowings</li>

        <li onclick="navigateTo('fines.html')">Fines</li>
      </ul>

      <div class="header-right">
        <div class="user-badge" id="userProfileName">Loading...</div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </header>

    <main class="dashboard-container">
      <div class="page-header">
        <h2>Users Management</h2>
        <button class="action-btn" onclick="openAddModal()">
          + Add New User
        </button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Username</th>
              <th>Full Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr>
              <td colspan="7" style="text-align: center; color: #94a3b8">
                Loading users...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <div class="modal-overlay" id="userModal">
      <div class="modal-box">
        <h3 id="modalTitle">Add New User</h3>
        <form id="userForm" onsubmit="handleFormSubmit(event)">
          <input type="hidden" id="personId" />

          <div class="form-group" id="usernameGroup">
            <label>Username</label>
            <input type="text" id="username" />
          </div>

          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="firstName" required />
          </div>

          <div class="form-group">
            <label>Second Name</label>
            <input type="text" id="secondName" />
          </div>

          <div class="form-group">
            <label>Third Name</label>
            <input type="text" id="thirdName" />
          </div>

          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lastName" required />
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required />
          </div>

          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="phoneNumber" />
          </div>

          <div class="form-group" id="passwordGroup">
            <label>Password</label>
            <input type="password" id="password" />
          </div>

          <div class="form-group" id="roleGroup">
            <label>Role</label>
            <select id="role">
              <option value="ADMIN">ADMIN</option>
              <option value="STAFF">STAFF</option>
            </select>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn-cancel" onclick="closeModal()">
              Cancel
            </button>
            <button type="submit" class="action-btn">Save User</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      let isEditMode = false;
      const CONTEXT_PATH = "/librarysystem-1.0-SNAPSHOT";

      const userJson = localStorage.getItem("currentUser");
      if (!userJson) {
        window.location.href = CONTEXT_PATH + "/login.html";
      } else {
        const user = JSON.parse(userJson);
        document.getElementById("userProfileName").innerText =
          `${user.firstName} ${user.lastName} (${user.role})`;

        if (user.role !== "ADMIN") {
          window.location.href = CONTEXT_PATH + "/dashboard.html";
        } else {
          loadUsers();
        }
      }

      async function loadUsers() {
        try {
          const response = await fetch(CONTEXT_PATH + "/api/users");
          if (response.ok) {
            const users = await response.json();
            const tbody = document.getElementById("usersTableBody");
            tbody.innerHTML = "";

            if (users.length === 0) {
              tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #94a3b8;">No users found.</td></tr>`;
              return;
            }

            users.forEach((u) => {
              const fullName =
                `${u.firstName || ""} ${u.secondName || ""} ${u.thirdName || ""} ${u.lastName || ""}`.trim();
              tbody.innerHTML += `
            <tr>
                <td>${u.personId || u.id}</td>
                <td>${u.username || "-"}</td>
                <td>${fullName}</td>
                <td>${u.email}</td>
                <td>${u.role}</td>
                <td>
                    <button class="btn-edit" onclick='openEditModal(${JSON.stringify(u)})'>Edit</button>
                    <button class="btn-delete" onclick="deleteUser(${u.personId || u.id})">Delete</button>
                </td>
            </tr>
          `;
            });
          }
        } catch (error) {
          console.error("Error:", error);
        }
      }

      function openAddModal() {
        isEditMode = false;
        document.getElementById("modalTitle").innerText = "Add New User";
        document.getElementById("userForm").reset();
        document.getElementById("personId").value = "";

        document.getElementById("usernameGroup").style.display = "block";
        document.getElementById("passwordGroup").style.display = "block";
        document.getElementById("roleGroup").style.display = "block";

        document.getElementById("username").setAttribute("required", "true");
        document.getElementById("password").setAttribute("required", "true");

        document.getElementById("userModal").classList.add("active");
      }

      function openEditModal(user) {
        isEditMode = true;
        document.getElementById("modalTitle").innerText = "Edit User Details";
        document.getElementById("personId").value = user.personId || user.id;
        document.getElementById("firstName").value = user.firstName || "";
        document.getElementById("secondName").value = user.secondName || "";
        document.getElementById("thirdName").value = user.thirdName || "";
        document.getElementById("lastName").value = user.lastName || "";
        document.getElementById("email").value = user.email || "";
        document.getElementById("phoneNumber").value = user.phoneNumber || "";

        document.getElementById("usernameGroup").style.display = "none";
        document.getElementById("passwordGroup").style.display = "none";
        document.getElementById("roleGroup").style.display = "none";

        document.getElementById("username").removeAttribute("required");
        document.getElementById("password").removeAttribute("required");

        document.getElementById("userModal").classList.add("active");
      }

      function closeModal() {
        document.getElementById("userModal").classList.remove("active");
      }

      async function handleFormSubmit(event) {
        event.preventDefault();

        const personId = document.getElementById("personId").value;
        const firstName = document.getElementById("firstName").value;
        const secondName = document.getElementById("secondName").value;
        const thirdName = document.getElementById("thirdName").value;
        const lastName = document.getElementById("lastName").value;
        const email = document.getElementById("email").value;
        const phoneNumber = document.getElementById("phoneNumber").value;

        if (isEditMode) {
          const updateData = {
            personId: parseInt(personId),
            firstName: firstName,
            secondName: secondName,
            thirdName: thirdName,
            lastName: lastName,
            email: email,
            phoneNumber: phoneNumber,
          };

          console.log("Sending PUT request with data:", updateData);

          try {
            const response = await fetch(CONTEXT_PATH + "/api/users", {
              method: "PUT",
              headers: {
                "Content-Type": "application/json;charset=UTF-8",
              },
              body: JSON.stringify(updateData),
            });

            console.log("Response status:", response.status);

            if (response.ok) {
              closeModal();
              loadUsers();
            } else {
              const err = await response.json();
              alert(err.error || "Update failed");
            }
          } catch (error) {
            console.error("Network or fetch error:", error);
          }
        } else {
          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;
          const role = document.getElementById("role").value;

          const addData = {
            username,
            password,
            role,
            firstName,
            secondName,
            thirdName,
            lastName,
            email,
            phoneNumber,
          };

          const response = await fetch(CONTEXT_PATH + "/api/users", {
            method: "POST",
            headers: {
              "Content-Type": "application/json;charset=UTF-8",
            },
            body: JSON.stringify(addData),
          });

          if (response.ok) {
            closeModal();
            loadUsers();
          } else {
            const err = await response.json();
            alert(err.error || "Failed to add user");
          }
        }
      }

      async function deleteUser(id) {
        if (confirm("Are you sure you want to delete this user?")) {
          const response = await fetch(
            CONTEXT_PATH + `/api/users?personId=${id}`,
            {
              method: "DELETE",
            },
          );

          if (response.ok) {
            loadUsers();
          } else {
            const err = await response.json();
            alert(err.error || "Delete failed");
          }
        }
      }

      function navigateTo(page) {
        window.location.assign(CONTEXT_PATH + "/" + page);
      }

      function logout() {
        localStorage.removeItem("currentUser");
        sessionStorage.removeItem("currentUser");
        window.location.href = CONTEXT_PATH + "/login.html";
      }
    </script>
  </body>
</html>
