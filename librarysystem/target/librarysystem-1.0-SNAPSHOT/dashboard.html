<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard - Library Management System</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100vh;
        background-color: #0b0f19;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        background:
          linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
          url("https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=1920&auto=format&fit=crop")
            no-repeat center center fixed;
        background-size: cover;
        color: #f8fafc;
      }

      .main-header {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 18px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 100;
      }

      .header-brand {
        font-size: 20px;
        font-weight: 700;
        color: #ffffff;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .header-brand span {
        color: #38bdf8;
      }

      .nav-links {
        display: flex;
        gap: 8px;
        list-style: none;
      }

      .nav-links li {
        padding: 9px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        color: #cbd5e1;
        transition: all 0.2s ease;
      }

      .nav-links li:hover {
        background: rgba(56, 189, 248, 0.15);
        color: #ffffff;
      }

      .nav-links li.active {
        background: #38bdf8;
        color: #0f172a;
        font-weight: 600;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .user-badge {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 7px 14px;
        border-radius: 20px;
        color: #e2e8f0;
        font-size: 13px;
        font-weight: 500;
      }

      .logout-btn {
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.2s ease;
      }

      .logout-btn:hover {
        background: #ef4444;
        color: #ffffff;
      }

      .dashboard-container {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 40px;
        max-width: 1350px;
        margin: 0 auto;
        width: 100%;
        overflow-y: auto;
      }

      .dashboard-overview {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 20px;
        width: 100%;
      }

      @media (max-width: 1100px) {
        .dashboard-overview {
          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }
      }

      .analytics-card {
        background: linear-gradient(
          135deg,
          rgba(15, 23, 42, 0.85) 0%,
          rgba(11, 15, 25, 0.9) 100%
        );
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 30px 24px;
        border-radius: 18px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .analytics-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(56, 189, 248, 0.4),
          transparent
        );
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .analytics-card:hover {
        transform: translateY(-6px);
        border-color: rgba(56, 189, 248, 0.3);
        box-shadow:
          0 25px 50px rgba(0, 0, 0, 0.6),
          0 0 30px rgba(56, 189, 248, 0.05);
      }

      .analytics-card:hover::before {
        opacity: 1;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .card-title {
        font-size: 13px;
        color: #94a3b8;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }

      .card-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: rgba(56, 189, 248, 0.08);
        border: 1px solid rgba(56, 189, 248, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #38bdf8;
      }

      .card-value {
        font-size: 38px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.5px;
        line-height: 1;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header class="main-header">
      <div class="header-brand">Library<span>System</span></div>

      <ul class="nav-links">
        <li class="active" onclick="navigateTo('dashboard.html')">Dashboard</li>
        <li id="navUsers" onclick="navigateTo('users.html')">Users</li>
        <li onclick="navigateTo('members.html')">Members</li>
        <li onclick="navigateTo('books.html')">Books</li>
        <li onclick="navigateTo('categories.html')">Categories</li>
        <li onclick="navigateTo('borrow.html')">Borrowings</li>

        <li onclick="navigateTo('fines.html')">Fines</li>
      </ul>

      <div class="header-right">
        <div class="user-badge" id="userProfileName">Loading...</div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </header>

    <main class="dashboard-container">
      <div class="dashboard-overview">
        <div class="analytics-card">
          <div class="card-header">
            <span class="card-title">Total Copies</span>
            <div class="card-icon">
              <svg
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"
                />
                <path d="M6 6h10M6 10h10" />
              </svg>
            </div>
          </div>
          <div class="card-value" id="statTotalCopies">...</div>
        </div>

        <div class="analytics-card">
          <div class="card-header">
            <span class="card-title">Total Members</span>
            <div class="card-icon">
              <svg
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
              </svg>
            </div>
          </div>
          <div class="card-value" id="statTotalMembers">...</div>
        </div>

        <div class="analytics-card">
          <div class="card-header">
            <span class="card-title">Available Books</span>
            <div class="card-icon">
              <svg
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                <polyline points="22 4 12 14.01 9 11.01" />
              </svg>
            </div>
          </div>
          <div class="card-value" id="statAvailableBooks">...</div>
        </div>

        <div class="analytics-card">
          <div class="card-header">
            <span class="card-title">Borrowed Books</span>
            <div class="card-icon">
              <svg
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"
                />
              </svg>
            </div>
          </div>
          <div class="card-value" id="statBorrowedBooks">...</div>
        </div>

        <div class="analytics-card">
          <div class="card-header">
            <span class="card-title">Categories</span>
            <div class="card-icon">
              <svg
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path d="M4 6h16M4 12h16m-7 6h7" />
              </svg>
            </div>
          </div>
          <div class="card-value" id="statCategories">...</div>
        </div>
      </div>
    </main>

    <script>
      const CONTEXT_PATH = "/librarysystem-1.0-SNAPSHOT";
      const userJson = localStorage.getItem("currentUser");

      if (!userJson) {
        window.location.href = CONTEXT_PATH + "/login.html";
      } else {
        const user = JSON.parse(userJson);

        document.getElementById("userProfileName").innerText =
          `${user.firstName} ${user.lastName} (${user.role})`;

        if (user.role !== "ADMIN") {
          const navUsers = document.getElementById("navUsers");
          if (navUsers) navUsers.classList.add("hidden");
        }

        fetchDashboardStats();
      }

      async function fetchDashboardStats() {
        try {
          const response = await fetch(CONTEXT_PATH + "/api/dashboard/stats");
          if (response.ok) {
            const data = await response.json();

            document.getElementById("statTotalCopies").innerText =
              data.totalBookCopies ?? 0;
            document.getElementById("statTotalMembers").innerText =
              data.totalMembers ?? 0;
            document.getElementById("statAvailableBooks").innerText =
              data.availableBooks ?? 0;
            document.getElementById("statBorrowedBooks").innerText =
              data.borrowedBooks ?? 0;
            document.getElementById("statCategories").innerText =
              data.totalCategories ?? 0;
          } else {
            console.error("Failed to load statistics");
          }
        } catch (error) {
          console.error("Error fetching stats:", error);
        }
      }

      function navigateTo(page) {
        window.location.assign(CONTEXT_PATH + "/" + page);
      }

      function logout() {
        localStorage.removeItem("currentUser");

        sessionStorage.removeItem("currentUser");
        window.location.href = CONTEXT_PATH + "/login.html";
      }
    </script>
  </body>
</html>
